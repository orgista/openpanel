name: Full Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openpanel-release-verification
  cancel-in-progress: false

jobs:
  verify-release:
    name: Build and verify signed release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out engine
        uses: actions/checkout@v4

      - name: Require pinned private UI revision
        env:
          OPENPANEL_UI_REF: ${{ vars.OPENPANEL_UI_REF }}
        run: |
          test -n "$OPENPANEL_UI_REF"
          [[ "$OPENPANEL_UI_REF" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out pinned private UI
        uses: actions/checkout@v4
        with:
          repository: orgista/openpanel-ui
          ref: ${{ vars.OPENPANEL_UI_REF }}
          token: ${{ secrets.UI_SUBMODULE_TOKEN }}
          path: src

      - name: Verify private UI checkout
        env:
          OPENPANEL_UI_REF: ${{ vars.OPENPANEL_UI_REF }}
        run: test "$(git -C src rev-parse HEAD)" = "$OPENPANEL_UI_REF"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verify:versions
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx cap sync android

      - name: Prepare release signing inputs
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openpanel-release.keystore"
          echo "OPENPANEL_KEYSTORE_FILE=$RUNNER_TEMP/openpanel-release.keystore" >> "$GITHUB_ENV"

      - name: Test, lint, and build signed release
        working-directory: android
        env:
          OPENPANEL_KEYSTORE_PASS: ${{ secrets.OPENPANEL_KEYSTORE_PASS }}
          OPENPANEL_KEY_ALIAS: ${{ secrets.OPENPANEL_KEY_ALIAS }}
          OPENPANEL_KEY_PASS: ${{ secrets.OPENPANEL_KEY_PASS }}
        run: >-
          ./gradlew
          :app:test
          :app:lintDebug
          :app:assembleDebugAndroidTest
          :app:assembleRelease
          --no-daemon
          --stacktrace

      - name: Verify signed APK identity
        env:
          EXPECTED_SIGNING_CERT_SHA256: ${{ vars.OPENPANEL_SIGNING_CERT_SHA256 }}
        run: |
          test -n "$EXPECTED_SIGNING_CERT_SHA256"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          SIGNATURE="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$SIGNATURE"
          grep -Fq "Number of signers: 1" <<< "$SIGNATURE"
          ACTUAL_SIGNING_CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$SIGNATURE")"
          ACTUAL_SIGNING_CERT_SHA256="$(tr -d ':[:space:]' <<< "$ACTUAL_SIGNING_CERT_SHA256" | tr '[:upper:]' '[:lower:]')"
          EXPECTED_SIGNING_CERT_SHA256="$(tr -d ':[:space:]' <<< "$EXPECTED_SIGNING_CERT_SHA256" | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_SIGNING_CERT_SHA256" = "$EXPECTED_SIGNING_CERT_SHA256"

          BADGING="$("$AAPT" dump badging "$APK")"
          grep -Fq "package: name='com.orgista.openpanel' versionCode='36' versionName='1.1.27'" <<< "$BADGING"
          grep -Fq "sdkVersion:'24'" <<< "$BADGING"
          grep -Fq "targetSdkVersion:'36'" <<< "$BADGING"
          grep -Fq "leanback-launchable-activity:" <<< "$BADGING"
          grep -Fq "uses-feature-not-required: name='android.hardware.location'" <<< "$BADGING"
